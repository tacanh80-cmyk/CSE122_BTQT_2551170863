<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Bài 1 - Trang thơ Bốn mùa</title>

    <!-- Liên kết CSS -->
    <link rel="stylesheet" href="1.css">
</head>

<body>

    

    <div class="khung-tho">

        <!-- Tiêu đề bài thơ -->
        <h2>BỐN MÙA</h2>

        <!-- Khổ thơ 1 -->
        <div class="kho kho-1">
            <p>Xuân về hoa nở khắp trời</p>
            <p>Hạ sang nắng cháy rạng ngời phố quen</p>
            <p>Thu về lá rụng bên thềm</p>
        </div>

        <hr>

        <!-- Khổ thơ 2 -->
        <div class="kho kho-2">
            <p>Đông sang gió lạnh bên em đợi chờ</p>
            <p>Bốn mùa là bốn giấc mơ</p>
            <p>Thời gian đi mãi ta chờ đợi ai</p>
        </div>

        <hr>

        <!-- Khổ thơ 3 -->
        <div class="kho kho-3">
            <p>Một năm rồi lại một năm</p>
            <p>Vẫn còn câu hát thì thầm quê hương</p>
            <p>Chờ xuân nắng mới soi đường</p>
        </div>

    </div>

</body>
</html>

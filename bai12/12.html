
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 12 - In lịch</title>

    <link rel="stylesheet" href="12.css">
</head>
<body>

    <h3 class="tieu-de">Bài 12 — In lịch</h3>

    <div class="khung">

        <div class="lich">
            <div id="nam">2026</div>
            <div id="thang">Tháng 12</div>
            <div id="ngay">20</div>
            <div id="thu">Thứ ba</div>
        </div>

        <p id="loi-chao">Chào buổi sáng!</p>

        <div class="form-nhap">

            <div class="o-nhap">
                <label for="ngay-nhap">Ngày</label>
                <input type="number" id="ngay-nhap" min="1" max="31">
            </div>

            <div class="o-nhap">
                <label for="thang-nhap">Tháng</label>
                <input type="number" id="thang-nhap" min="1" max="12">
            </div>

            <div class="o-nhap">
                <label for="nam-nhap">Năm</label>
                <input type="number" id="nam-nhap" min="1">
            </div>

            <button id="nut-in">In lịch</button>

        </div>

    </div>

    <script src="12.js"></script>

</body>
</html>

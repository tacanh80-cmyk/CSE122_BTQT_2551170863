
<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ với chúng tôi</title>

    <!-- Kết nối file CSS -->
    <link rel="stylesheet" href="10.css">
</head>
<body>

    <!-- Khung biểu mẫu -->
    <div class="form-lien-he">

        <!-- Phần tiêu đề -->
        <div class="tieu-de">
            <h2>Liên hệ với chúng tôi</h2>
            <p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p>
        </div>

        <!-- Phần nhập thông tin -->
        <form action="#" method="post">

            <div class="form-body">

                <!-- Hàng thứ nhất -->
                <div class="hang">

                    <div class="nhom">
                        <label for="hoten">Họ và tên</label>
                        <input type="text" id="hoten" name="hoten"
                               value="Nguyễn Văn An">
                    </div>

                    <div class="nhom">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email"
                               value="an.nv@tlu.edu.vn">
                    </div>

                </div>

                <!-- Hàng thứ hai -->
                <div class="hang">

                    <div class="nhom">
                        <label for="sodienthoai">Số điện thoại</label>
                        <input type="tel" id="sodienthoai"
                               name="sodienthoai"
                               value="0987 654 321">
                    </div>

                    <div class="nhom">
                        <label for="chude">Chủ đề</label>
                        <select id="chude" name="chude">
                            <option value="khoahoc" selected>
                                Hỏi về khóa học
                            </option>
                            <option value="hocphi">Hỏi về học phí</option>
                            <option value="kythuat">Hỗ trợ kỹ thuật</option>
                            <option value="khac">Khác</option>
                        </select>
                    </div>

                </div>

                <!-- Phần nội dung dài -->
                <div class="nhom noi-dung">
                    <label for="noidung">Nội dung</label>
                    <textarea id="noidung" name="noidung"
                              rows="4">Em muốn hỏi về lịch nộp bài tập môn Lập trình Web ạ.</textarea>
                </div>

                <!-- Checkbox đồng ý -->
                <div class="dong-y">
                    <input type="checkbox" id="dongy" name="dongy" checked>

                    <label for="dongy">
                        Tôi đồng ý nhận email phản hồi.
                    </label>
                </div>

                <!-- Hai nút chức năng -->
                <div class="nut">
                    <button type="submit">Gửi liên hệ</button>
                    <button type="reset" class="nut-nhap-lai">
                        Nhập lại
                    </button>
                </div>

            </div>

        </form>

    </div>

</body>
</html>
